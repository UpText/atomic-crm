user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Match raw TLS handshake bytes, before access-log escaping turns them
    # into \x16\x03. Keep logging all other requests, including HTTP 400s.
    map "$status:$request" $loggable_request {
        default 1;
        ~^400:\x16\x03 0;
    }
    access_log /var/log/nginx/access.log main if=$loggable_request;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
